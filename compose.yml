services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-todo_app}
      POSTGRES_USER: ${DB_USERNAME:-todo_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-todo_app_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Uncomment to reach the database from your host at localhost:5433
    # ports:
    #   - "5433:5432"

  backend:
    build: ./backend
    environment:
      # Inside Compose, the database is reached by its service name, not localhost
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-todo_app}
      DB_USERNAME: ${DB_USERNAME:-todo_app}
      DB_PASSWORD: ${DB_PASSWORD:-todo_app_password}
      # The app binds to 127.0.0.1 by default, which other containers cannot reach
      SERVER_ADDRESS: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
