services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: todo_app
      DB_USERNAME: todo_app
      DB_PASSWORD: todo_123
      SERVER_ADDRESS: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: todo_app
      POSTGRES_USER: todo_app
      POSTGRES_PASSWORD: todo_123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_app -d todo_app"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

