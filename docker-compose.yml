services:
  
  db:
    image: postgres:16
    container_name: database
    environment:
      POSTGRES_DB: todo_app
      POSTGRES_USER: todo_app
      POSTGRES_PASSWORD: waleed
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_app -d todo_app"]
      interval: 5s
      retries: 10
    networks:
      - todo-app

  backend:
    build: ./backend
    container_name: app-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: todo_app
      DB_USERNAME: todo_app
      DB_PASSWORD: waleed
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - todo-app

  frontend:
    build: ./frontend
    container_name: app-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173" 
    networks:
      - todo-app

volumes:
  pgdata:
networks:
  todo-app:
